name: Lembretes da agenda (WhatsApp)

on:
  schedule:
    # 19:30 UTC = 16:30 em Brasília -> aviso da véspera (evento de amanhã)
    - cron: '30 19 * * *'
    # 09:30 UTC = 06:30 em Brasília -> aviso do dia (evento de hoje)
    - cron: '30 9 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo do lembrete'
        type: choice
        options: ['antes', 'hoje']
        default: 'antes'

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Definir modo do lembrete
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 9 * * *" ]; then
            echo "value=hoje" >> "$GITHUB_OUTPUT"
          else
            echo "value=antes" >> "$GITHUB_OUTPUT"
          fi
      - name: Enviar lembretes pendentes
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          REMINDER_MODE: ${{ steps.mode.outputs.value }}
        run: node scripts/send-reminders.mjs
