name: Deploy webhook do WhatsApp (Cloudflare Workers)

on:
  push:
    branches: [main]
    paths:
      - 'webhook/**'
      - '.github/workflows/deploy-webhook.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências do Worker
        working-directory: webhook
        run: npm install
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: webhook
          secrets: |
            CALLMEBOT_PHONE
            CALLMEBOT_APIKEY
            CALLMEBOT_PHONE_EMANUELLY
            CALLMEBOT_APIKEY_EMANUELLY
            VAPID_PRIVATE_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          CALLMEBOT_PHONE_EMANUELLY: ${{ secrets.CALLMEBOT_PHONE_EMANUELLY }}
          CALLMEBOT_APIKEY_EMANUELLY: ${{ secrets.CALLMEBOT_APIKEY_EMANUELLY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
